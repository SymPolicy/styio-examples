<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    body { margin: 0; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; background: #0f1210; color: #f6efde; }
    main { width: min(40rem, calc(100% - 2rem)); margin: 4rem auto; }
    .eyebrow { letter-spacing: 0.16em; text-transform: uppercase; color: #c4622d; font-size: 0.72rem; }
    h1 { font-family: Palatino, Georgia, serif; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 0.95; }
    a { color: #f3ead6; }
    footer { color: #8a7d68; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Styio Algorithm Gallery</p>
    <h1>Page not found</h1>
    <p>That case id is not in the current generated map. It may have been renamed upstream.</p>
    <p><a href="{{home_href}}">Return to the gallery</a></p>
    <footer>{{footer}}</footer>
  </main>
</body>
</html>
